version: 2.1

executors:
  main:
    docker:
      - image: cimg/aws:2024.03


jobs:
  build:
    executor: main
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: Free
      POSTGRES_PASSWORD: Willy
      PGPASSWORD: Willy
    steps:
      - setup_remote_docker
      - run:
          name: Spin up DB
          command: docker container run -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -p "127.0.0.1:5432:5432/tcp" --detach cimg/postgres:14.7
      - run:
          name: Wait for DB to be ready
          command: |
            dockerize -wait tcp://127.0.0.1:5432 -timeout 1m
      - checkout
      - run:
          name: Insert records
          command: |
            psql -h 127.0.0.1 -p 5432 -d wiki -U Free -f schema.sql
      - run:
          # From Postgres >= v12, JIT is on by default.
          # https://www.postgresql.org/docs/current/runtime-config-query.html#GUC-JIT
          name: Check JIT
          command: |
            psql -h 127.0.0.1 -p 5432 -d wiki -U Free -c "SHOW jit;"
            psql -h 127.0.0.1 -p 5432 -d wiki -U Free -c "SELECT pg_jit_available();"
